<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial World</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <header>
        <div class="logo">
            <span class="icon">🌍</span>
            <h3>Trivia World</h3>
        </div>
        <nav>Capitals & Countries</nav>
    </header>

    <main>

        <span class="icon">🌍</span>
        <h1>Trivial World</h1>
        <p>Welcome to Trivial World!</p>
        <p>Select a continent </p>

        <section class = "continents">   
        <div class = "card">
            <span class = "icon">🌍</span>
            <h4>World</h4>
            <p>All regions</p>
        </div>

        <div class = "card">
            <span class = "icon">🌎</span>
            <h4>America</h4>
            <p>44 countries</p>
        </div>

        <div class = "card">
            <span class = "icon">🌏</span>
            <h4>Asia</h4>
            <p>48 countries</p>

        </div>

        <div class = "card">
            <span class = "icon">🌍</span>
            <h4>Africa</h4>
            <p>54 countries</p>
        </div>

        <div class = "card">
            <span class = "icon">🌎</span>
            <h4>Europe</h4>
            <p>44 countries</p>
        </div>

        <div class = "card">
            <span class = "icon">🌏</span>
            <h4>Oceania</h4>
            <p>16 countries</p>
        </div>  

        </section>


    </main>

    



</body>
</html>
